@media (max-width: 650px) {

    padding: 28px 18px 20px;

  .preview-toolbar {

  .preview-summary,
  .preview-list-heading {

  .full-place-preview-list {

  }

  .taxonomy-panel {

  .detail-column {

@media (max-width: 480px) {

    align-items: flex-start;
    flex-direction: column;
    margin-bottom: 22px;
  }

  .page-heading h1 {
    font-size: 25px;
  }

  .form-fields {
    grid-template-columns: 1fr;
  }

  .place-preview {
    flex-wrap: wrap;
    padding: 7px 0;
  }

  .place-copy {
    min-width: calc(100% - 55px);
  }

  .place-tag {
    margin-left: 42px;
  }

  .page-footer {

	function itineraryPage(row, readonly = false, day = selectedDay) {

	function render() {

	function setBusyControls() {

	function openModal(next) {

	function closeModal() {

	function renderModal() {

	function publicView(row) {

			...row.snapshot,
			id: row.id,
			sourceTripId: row.sourceTripId,
			createdAt: row.createdAt,
			updatedAt: row.updatedAt,
			labels: []

	}
	async function loadRows() {
		return db.transaction("r", db.tables, async () => {
			const [trips, regions, places, items, labels, publicRows] = await Promise.all([

				db.regions.toArray(),

				db.labels.toArray(),

					const region = regions.find((region) => region.id === trip.regionId);

						region,
						places: places.filter((place) => place.regionIds.includes(region.id)),
						items: items.filter((item) => item.tripId === trip.id),

				places,
				labels

	}
	function adoptRows(rows) {
		personalRegions = rows.regions;
		personalPlaces = rows.places;
		personalLabels = rows.labels;
		personal = rows.personalRows;
		publicTrips = rows.publicRows;

			} else if (JSON.stringify(current) !== JSON.stringify(modal.row)) {

		const position = searchFocused ? focused.selectionStart : null;

			const input = document.getElementById("search");

			} catch {}

	var errorCopy = {

		SOURCE_NOT_FOUND: "來源行程已不存在，無法發佈或更新。",
		SOURCE_MISMATCH: "公開版本與來源行程不符，請關閉視窗後重試。",
		ALREADY_PUBLISHED: "此來源已有公開版本，請使用更新公開版本。",
		INVALID_SOURCE: "來源行程缺少區域或地點，請先修正資料。"
	};
	function showError(error) {

		render();
		const target = document.getElementById("dialog-error");
		if (target) {
			target.textContent = errorMessage;
			target.className = "public-apply-notice public-error-notice";
		}
		console.error("Public itinerary operation failed", error);
	}
	async function write(operation) {
		if (busy) return;
		busy = true;
		errorMessage = "";
		notice = "";
		setBusyControls();
		let message;
		try {
			message = await operation();
		} catch (error) {
			busy = false;

			showError(error);

				adoptRows(await loadRows());
			} catch {}
			setBusyControls();
			return;
		}
		try {
			const rows = await loadRows();
			busy = false;
			closeModal();
			notice = message;
			adoptRows(rows);
		} catch (error) {
			busy = false;
			closeModal();
			notice = message;
			errorMessage = "操作已儲存，但無法重新載入列表。請重新整理頁面查看。";

			console.error("Public itinerary refresh failed", error);

		}
	}
	document.addEventListener("click", (event) => {

	});
	async function handleClick(event) {

		if (menu) menu.open = false;

		const row = personal.find((row) => row.trip.id === selectedId);

			modalDay = Number(button.dataset.day);

		}
		if (name === "preview") {
			const id = button.dataset.id;
			return openModal({
				type: "preview",
				row: {
					...await core.readSnapshot(id),
					id,
					labels: []
				}
			});
		}
		if (row && [
			"publish",
			"update-public",
			"withdraw-public",
			"edit-trip",
			"edit-item"
		].includes(name ?? "")) {
			const published = publicTrips.find((published) => published.sourceTripId === row.trip.id);
			if (name === "update-public" || name === "withdraw-public") {
				if (!published) throw new SharingError("PUBLIC_NOT_FOUND");
				return openModal({
					type: name === "update-public" ? "update" : "withdraw",
					row,
					published
				});
			}
			if (name === "publish") return openModal({
				type: "publish",
				row
			});

				type: "edit",
				row,
				item: name === "edit-item" ? row.items.find((item) => item.id === button.dataset.id) : void 0

		}

			const publicRow = publicTrips.find((row) => row.id === button.dataset.id);

			});

			managementRegionId = "";
			managementLabelId = "";
			section = "places";
		}
		if (name === "view-region") {
			managementRegionId = button.dataset.id;
			managementLabelId = "";
			section = "places";
		}
		if (name === "view-label") {
			managementLabelId = button.dataset.id;
			managementRegionId = "";
			section = "places";
		}
		if (name === "view-trip") {
			selectedId = button.dataset.id;
			selectedDay = 0;
			section = "itinerary";
		}
		if (name === "clear-management") {

			managementLabelId = "";

		if (name && [
			"mine",
			"public",
			"navigate"
		].includes(name)) {

			sidebarOpen = false;
		}
		if (name === "dismiss") {

		}

	}
	function searchInput(event) {
		if (!(event.target instanceof HTMLInputElement) || event.target.id !== "search" || busy) return;

		} catch {}
	}
	document.addEventListener("input", searchInput);
	document.addEventListener("compositionend", searchInput);
	document.addEventListener("change", (event) => {

		if (event.target.id === "region") regionFilter = event.target.value;
		if (event.target.id === "management-region") managementRegionId = event.target.value;

	});
	document.addEventListener("submit", (event) => {
		if (!(event.target instanceof HTMLFormElement) || event.target.id !== "edit-form" || !modal || busy) return;

		const current = modal;
		const name = String(data.get("name") ?? "").trim();
		if (!current.item && !name) return;
		write(async () => {
			if (current.item) await db.transaction("rw", db.itineraryItems, async () => {
				if (!await db.itineraryItems.update(current.item.id, {
					arrivalTime: String(data.get("arrivalTime") ?? ""),
					note: String(data.get("note") ?? "")

			});
			else await db.transaction("rw", db.trips, async () => {
				if (!await db.trips.update(current.row.trip.id, { name })) throw new SharingError("SOURCE_NOT_FOUND");

		});
	});
	document.addEventListener("pointerdown", (event) => {
		document.querySelectorAll(".itinerary-action-menu[open], .itinerary-trip-switcher[open]").forEach((menu) => {

		});
	});
	document.addEventListener("keydown", (event) => {

		const first = nodes[0], last = nodes.at(-1);

			last?.focus();
		} else if (!event.shiftKey && (document.activeElement === last || document.activeElement === dialog)) {
			event.preventDefault();
			first?.focus();
		}
	});
	async function initialize() {
		busy = true;
		app.innerHTML = "<p class=\"poc-loading\" role=\"status\">正在載入行程…</p>";
		try {
			await seedDemoDatabase(db, createDemoDataset());
			const rows = await loadRows();
			busy = false;
			adoptRows(rows);
			liveQuery(loadRows).subscribe({
				next: adoptRows,
				error: showError

		} catch (error) {
			busy = false;
			app.innerHTML = "<div class=\"poc-loading\" role=\"alert\"><p>無法載入本機行程，請確認瀏覽器允許儲存本機資料後重試。</p>" + action("retry", "重新載入") + "</div>";

		}
	}
	initialize();
	//#endregion
})();
