<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TripMap 帳號管理</title>
  <link rel="stylesheet" href="account.css">
  <script src="account.js" type="module"></script>
</head>
<body>
  <main>
    <header><img src="icons/icon48.png" width="40" height="40" alt=""><div><h1>TripMap</h1><p>快捷加入地點</p></div></header>
    <section aria-labelledby="account-heading">
      <h2 id="account-heading">帳號管理</h2>
      <p id="status" role="status">正在確認登入狀態…</p>
      <div id="signed-in" hidden>
        <span class="label">目前登入帳號</span>
        <p id="email"></p>
        <p class="hint">登入狀態已保存在此擴充套件。</p>
        <button id="sign-out" class="secondary" type="button">登出</button>
      </div>
      <button id="sign-in" type="button" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.61 24.46c0-1.36-.12-2.66-.35-3.92H24.8v7.42h10.54a9.02 9.02 0 0 1-3.91 5.92v4.92h6.33c3.7-3.41 5.85-8.43 5.85-14.34Z"/><path fill="#34A853" d="M24.8 43.6c5.28 0 9.71-1.75 12.95-4.8l-6.33-4.92c-1.75 1.18-3.99 1.89-6.62 1.89-5.1 0-9.42-3.45-10.96-8.1H7.3v5.07A19.56 19.56 0 0 0 24.8 43.6Z"/><path fill="#FBBC05" d="M13.84 27.67a11.75 11.75 0 0 1 0-7.5V15.1H7.3a19.56 19.56 0 0 0 0 17.64l6.54-5.07Z"/><path fill="#EA4335" d="M24.8 12.07c2.88 0 5.45 1 7.49 2.96l5.62-5.62A18.8 18.8 0 0 0 24.8 4.25 19.56 19.56 0 0 0 7.3 15.1l6.54 5.07c1.54-4.65 5.86-8.1 10.96-8.1Z"/></svg>
        <span>使用 Google 登入</span>
      </button>
      <p id="error" role="alert" hidden></p>
    </section>
    <details>
      <summary>OAuth 連線設定</summary>
      <p class="hint">首次設定時，將此固定網址加入 Supabase 的 Redirect URLs。</p>
      <code id="redirect"></code>
      <button id="copy" class="secondary" type="button">複製回跳網址</button>
      <p id="copy-status" class="hint" role="status"></p>
    </details>
    <footer>目前僅提供地點辨識入口，尚未啟用新增儲存。</footer>
  </main>
</body>
</html>
